<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Floatbot</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.4 1.3 4.6 3.4 6.1L4 21l4.2-1.6c1.2.4 2.5.6 3.8.6 5.5 0 10-3.6 10-8S17.5 3 12 3zm0 14c-1.1 0-2.1-.2-3.1-.5l-.7-.2-.7.3-1.5.6.4-1.5.2-.7-.5-.6C4.8 13.2 4 12.1 4 11c0-3.3 3.6-6 8-6s8 2.7 8 6-3.6 6-8 6z"/></svg>
    </div>
    <div>
      <h1>Floatbot</h1>
      <p>OA assistant · v1.1</p>
    </div>
  </header>

  <form id="form">
    <label>
      API Key
      <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
    </label>

    <label>
      Provider
      <select id="provider"></select>
    </label>

    <label>
      Model
      <select id="model"></select>
    </label>
    <p class="model-hint" id="modelHint"></p>

    <div class="appearance">
      <p class="section-title">Appearance</p>
      <label class="range-label">
        <span>Button size <em id="bubbleSizeVal">56px</em></span>
        <input id="bubbleSize" type="range" min="40" max="80" step="2" />
      </label>
      <label class="range-label">
        <span>Button opacity <em id="bubbleOpacityVal">100%</em></span>
        <input id="bubbleOpacity" type="range" min="20" max="100" step="5" />
      </label>
      <label class="range-label">
        <span>Chat opacity <em id="chatOpacityVal">98%</em></span>
        <input id="chatOpacity" type="range" min="40" max="100" step="2" />
      </label>
      <label class="range-label">
        <span>Chat font size <em id="chatFontSizeVal">13.5px</em></span>
        <input id="chatFontSize" type="range" min="12" max="18" step="0.5" />
      </label>
    </div>

    <div class="appearance">
      <p class="section-title">OA options</p>
      <label class="check-row"><input id="examMode" type="checkbox" /> Exam mode (shield)</label>
      <label class="check-row"><input id="streamEnabled" type="checkbox" /> Stream replies</label>
      <label class="check-row"><input id="typedInsert" type="checkbox" /> Typed insert</label>
      <label class="check-row"><input id="persistChats" type="checkbox" /> Persist chats</label>
    </div>

    <details class="advanced">
      <summary>Advanced settings</summary>
      <div class="advanced-body">
        <label>
          API Base URL
          <input id="apiBase" type="text" placeholder="https://api.openai.com/v1" />
        </label>
        <label>
          System prompt
          <textarea id="systemPrompt" rows="3"></textarea>
        </label>
        <p class="hint">Hotkeys: Alt+Shift+F open · P problem · E editor · I insert last code</p>
      </div>
    </details>

    <button type="submit">Save</button>
    <p id="status" class="status" role="status"></p>
  </form>

  <footer>
    Load problem fills the chat box. Insert pastes code at your cursor in the page.
  </footer>

  <script src="../shared/models.js"></script>
  <script src="popup.js"></script>
</body>
</html>
